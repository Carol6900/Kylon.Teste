name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "Kylon_Grecomancia_Projeto_Godot_0_3.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Baixar Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Instalar modelos de exportação
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -jo Godot_v4.3-stable_export_templates.tpz "templates/*" -d ~/.local/share/godot/export_templates/4.3.stable

      - name: Extrair projeto
        run: |
          unzip -o Kylon_Grecomancia_Projeto_Godot_0_3.zip

      - name: Gerar APK
        run: |
          cd Kylon_Grecomancia
          mkdir -p build
          godot --headless --path . --export-debug "Android APK" build/Kylon_Grecomancia.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Kylon-Grecomancia-APK
          path: Kylon_Grecomancia/build/Kylon_Grecomancia.apk
          if-no-files-found: error
          
