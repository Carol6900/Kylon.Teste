name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "Kylon_Grecomancia_Projeto_Godot_0_3.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair arquivos
        run: |
          apt-get update
          apt-get install -y unzip
          unzip -o Kylon_Grecomancia_Projeto_Godot_0_3.zip

      - name: Gerar APK
        run: |
          cd Kylon_Grecomancia
          mkdir -p build
          godot --headless --path . --export-debug "Android APK" build/Kylon_Grecomancia.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Kylon-Grecomancia-APK
          path: Kylon_Grecomancia/build/Kylon_Grecomancia.apk
          if-no-files-found: error
